name: Feature request / 功能建议
description: Suggest a desktop pet improvement / 提出桌宠改进建议
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Use case / 使用场景
      description: What would you like to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / 期望行为
      description: Describe the behavior you would like to see.
    validations:
      required: true
